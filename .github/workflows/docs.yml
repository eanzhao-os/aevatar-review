name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material pymdown-extensions

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli (pinned to site mermaid 11.x)
        run: npm i -g @mermaid-js/mermaid-cli@11.15.0

      - name: Checkout frozen upstream
        uses: actions/checkout@v4
        with:
          repository: aevatarAI/aevatar
          ref: f02aa690bbebb9cabeac30a553d737486b0eb661
          path: .ci-upstream/aevatar
          fetch-depth: 1

      - name: Materialize frozen upstream
        run: |
          mkdir -p "$RUNNER_TEMP/aevatar-f02aa690"
          git -C .ci-upstream/aevatar cat-file -e f02aa690bbebb9cabeac30a553d737486b0eb661^{commit}
          git -C .ci-upstream/aevatar archive f02aa690bbebb9cabeac30a553d737486b0eb661 | tar -x -C "$RUNNER_TEMP/aevatar-f02aa690"
          rm -rf .ci-upstream

      - name: Checkout live upstream (sync baseline)
        uses: actions/checkout@v4
        with:
          repository: aevatarAI/aevatar
          ref: feature/integrate
          path: .ci-upstream/aevatar-live
          fetch-depth: 1

      - name: Validate chapter contracts
        run: AEVATAR_SRC="$RUNNER_TEMP/aevatar-f02aa690" AEVATAR_SRC2="$GITHUB_WORKSPACE/.ci-upstream/aevatar-live" bash scripts/check-md.sh --all

      - name: Validate links and anchors
        run: python3 scripts/check-links.py --all

      - name: Validate documentation drift
        run: bash scripts/check-drift.sh

      - name: Validate mermaid diagrams
        run: python3 scripts/check-mermaid.py

      - name: Build site
        run: mkdocs build --strict --clean

      - name: Validate site navigation layout
        run: python3 scripts/check-site-ui.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
